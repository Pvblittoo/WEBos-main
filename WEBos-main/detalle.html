    <!-- SECCIÓN PRINCIPAL DEL PRODUCTO (Diseño basado en la imagen) -->
    <main class="product-hero">
        
        <!-- Columna Izquierda: Información -->
        <div class="product-info">
            <h1 class="brand-name" id="product-brand">Jordan</h1>
            <h2 class="product-title" id="product-title">Cargando producto...</h2>
            
            <p class="description" id="product-description">Estamos cargando la información del producto.</p>
            
            <div class="purchase-area">
                <span class="price" id="product-price"></span>
                <a href="compra.html" class="btn-buy" id="buy-button">Comprar Ahora</a>
                <a href="javascript:history.back()" class="btn-back">volver atras</a>
            </div>
            
            
        </div>

        <!-- Columna Derecha: Imagen y Fondo Animado/Gráfico -->
        <div class="product-display">
            <!-- Gráfico de líneas dinámicas de fondo (SVG inline) -->
            <svg class="abstract-lines" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#FF3333;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#ff9900;stop-opacity:0" />
                    </linearGradient>
                </defs>
                <path d="M50,250 C150,50 350,50 450,250 C350,450 150,450 50,250 Z" stroke="url(#grad1)" stroke-width="2" fill="none" />
                <path d="M70,250 C160,80 340,80 430,250 C340,420 160,420 70,250 Z" stroke="url(#grad1)" stroke-width="1.5" fill="none" />
                <path d="M90,250 C170,110 330,110 410,250 C330,390 170,390 90,250 Z" stroke="url(#grad1)" stroke-width="1.2" fill="none" opacity="0.8"/>
                <path d="M110,250 C180,140 320,140 390,250 C320,360 180,360 110,250 Z" stroke="url(#grad1)" stroke-width="1" fill="none" opacity="0.6"/>
                <path d="M130,250 C190,170 310,170 370,250 C310,330 190,330 130,250 Z" stroke="url(#grad1)" stroke-width="0.8" fill="none" opacity="0.4"/>
            </svg>
            
            <!-- Imagen principal de la zapatilla -->
            <img src="img/re1.png" alt="Producto" class="main-shoe-img" id="product-image">
        </div>

    </main>
