<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facture Sneakers - Bienvenido</title>
    <link rel="stylesheet" href="css/portada.css">
    <link rel="stylesheet" href="css/navbar.css">
</head>
<body>

    <!-- FONDO: DRAGÓN INTERACTIVO -->
    <div class="dragon-container">
        <!-- Es importante que el SVG tenga id="svg" para que el script lo encuentre -->
        <svg id="svg">
            <defs>
                <!-- CABEZA DEL DRAGÓN -->
                <g id="head" transform="matrix(1, 0, 0, 1, 0, 0)">
                    <path style="fill: #111; stroke: #FF0033; stroke-width: 1px;" d="M-13.4-9.5c0,0-5.8,5.4-5.8,9.5s5.8,9.5,5.8,9.5l8.7-3.1l6.1,3.1c0,0,4.2-6.5,4.2-9.5 s-4.2-9.5-4.2-9.5l-6.1,3.1L-13.4-9.5z"/>
                    <circle cx="-11" cy="-4" r="1.5" fill="#FF0033" />
                    <circle cx="-11" cy="4" r="1.5" fill="#FF0033" />
                </g>

                <!-- ALETAS / ESCAMAS -->
                <g id="aleta">
                    <path style="fill: url(#linearGradient_1);" d="M0,0 c10,-15 30,-20 50,-10 c-15,-5 -35,-2 -50,10 Z" />
                    <path style="fill: url(#linearGradient_1);" d="M0,0 c10,15 30,20 50,10 c-15,5 -35,2 -50,-10 Z" />
                </g>

                <!-- GRADIENTE -->
                <linearGradient id="linearGradient_1" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100%" y2="0">
                    <stop offset="0" style="stop-color: #FF0033; stop-opacity: 0.8" />
                    <stop offset="1" style="stop-color: #000000; stop-opacity: 0" />
                </linearGradient>
            </defs>
            
            <g id="scene"></g>
        </svg>
    </div>

    <!-- TARJETA CENTRAL -->
    <main class="hero-overlay">
        <div class="hero-content">
            <h1 class="brand-title">FACTURE SNEAKERS</h1>
            <p class="brand-description">
                Tu tienda urbana de confianza. Descubre las zapatillas más exclusivas, lanzamientos limitados y el mejor estilo streetwear en un solo lugar.
            </p>
            
            <div class="button-group">
                <a href="index.html" class="btn btn-red">Ver Productos</a>
                <a href="acceso.html" class="btn btn-red-outline">Iniciar Sesión</a>
            </div>
        </div>
    </main>

    <!-- SCRIPT DEL DRAGÓN -->
    <script src="js/script.js"></script>
    <script src="js/navbar.js"></script>
</body>
</html>
