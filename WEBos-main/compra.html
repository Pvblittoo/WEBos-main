<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprar - Sneakers Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/navbar.css">
</head>
<body>

    <!-- MENÚ DE NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg custom-nav" style="background-color: #ffffff !important;">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
          <img src="img/Gemini_Generated_Image_8lcyk68lcyk68lcy.jpg" alt="Logo" height="60" class="d-inline-block align-text-top me-3">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-2">
            <li class="nav-item"><a class="nav-link custom-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link custom-link" href="contacto.html">Contacto</a></li>
            <li class="nav-item"><a class="nav-link custom-link" href="pagina2.html">pagina2</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- FORMULARIO DE PEDIDO -->
    <div class="checkout-container">
        <h2>FINALIZAR PEDIDO</h2>
        
        <form action="#" method="POST" class="order-form">
            
            <!-- SELECCIÓN DE TALLA EN CUADRADOS -->
            <div class="form-group">
                <label class="section-title">SELECCIONA TU TALLA:</label>
                <div class="size-picker" id="size-picker" aria-live="polite">
                    Cargando tallas disponibles...
                </div>
            </div>

            <div class="form-group">
              <label for="cantidad">CANTIDAD:</label>
              <input type="number" id="cantidad" name="cantidad" min="1" value="1" required>
            </div>

            <button type="submit" class="btn-buy">AGREGAR AL CARRITO</button>
        </form>
        <!-- BOTÓN PARA VOLVER ATRÁS -->
        <div class="text-center mt-3">
          <button onclick="window.location.href='index.html'" class="btn-back">← Volver atrás</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/compra.js"></script>
</body>
</html>
