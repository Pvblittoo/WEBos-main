<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Pago</title>
    <link rel="stylesheet" href="css/comprar.css">
    <link rel="stylesheet" href="css/navbar.css">
</head>
<body>

    <div class="checkout-wrapper">
        <div class="header-titles">
            <h1>FORMULARIO DE PAGO VISA</h1>
            <p>Efecto de Tarjeta 3D en Tiempo Real</p>
        </div>

        <!-- CONTENEDOR DE LA TARJETA 3D -->
        <div class="card-container">
            <div class="card-inner" id="card-inner">
                
                <!-- PARTE FRONTAL -->
                <div class="card-front">
                    <div class="card-logo">
                        <i>VISA</i>
                    </div>
                    <img src="https://cdn-icons-png.flaticon.com/512/6404/6404100.png" alt="Chip" class="chip-icon">
                    <div class="card-number" id="card-number-display">#### #### #### ####</div>
                    <div class="card-details">
                        <div class="card-name">
                            <span>Titular de la tarjeta</span>
                            <div id="card-name-display">NOMBRE COMPLETO</div>
                        </div>
                        <div class="card-expires">
                            <span>Expira</span>
                            <div id="card-expiry-display">MM/YY</div>
                        </div>
                    </div>
                </div>

                <!-- PARTE TRASERA (Como en tu imagen) -->
                <div class="card-back">
                    <div class="magnetic-stripe"></div>
                    <div class="signature-area">
                        <span>AUTHORIZED SIGNATURE</span>
                        <div class="signature-box">
                            <span id="card-cvv-display"></span>
                        </div>
                    </div>
                    <p class="cvv-info">Código de seguridad CVV de 3 dígitos al reverso de la tarjeta.</p>
                </div>

            </div>
        </div>

        <!-- FORMULARIO DE PAGO -->
        <form class="payment-form">
            <div class="input-group">
                <input type="text" id="card-number-input" placeholder="Número de tarjeta" maxlength="19">
            </div>
            
            <div class="input-group">
                <input type="text" id="card-name-input" placeholder="Nombre en la tarjeta" maxlength="30">
            </div>

            <div class="row-group">
                <div class="input-group select-group">
                    <select id="card-month-input">
                        <option value="" disabled selected>Mes</option>
                        <option value="01">01</option>
                        <option value="02">02</option>
                        <option value="03">03</option>
                        <option value="04">04</option>
                        <option value="05">05</option>
                        <option value="06">06</option>
                        <option value="07">07</option>
                        <option value="08">08</option>
                        <option value="09">09</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                    </select>
                </div>
                <div class="input-group select-group">
                    <select id="card-year-input">
                        <option value="" disabled selected>Año</option>
                        <option value="24">24</option>
                        <option value="25">25</option>
                        <option value="26">26</option>
                        <option value="27">27</option>
                        <option value="28">28</option>
                        <option value="29">29</option>
                        <option value="30">30</option>
                    </select>
                </div>
                <div class="input-group cvv-group">
                    <input type="text" id="card-cvv-input" placeholder="CVV" maxlength="3">
                </div>
            </div>

            <button type="button" class="btn-submit">Confirmar Pago</button>
        </form>
    </div>

    <script src="js/pago-tarjeta.js"></script>
    <script src="js/navbar.js"></script>
</body>
</html>
