# Configuración usada SOLO por las pruebas: base de datos temporal en memoria
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.profiles.active=test

# El correo apunta a un puerto local cerrado para que las pruebas no esperen a Gmail
spring.mail.host=localhost
spring.mail.port=3025

app.jwt.secret=dGVzdC1zZWNyZXQtcGFyYS1wcnVlYmFzLWRlLWludGVncmFjaW9uLWZhY3R1cmUtc25lYWtlcnM=
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000
app.jwt.cookie-secure=false