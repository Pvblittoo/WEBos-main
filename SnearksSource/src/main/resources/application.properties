
# Base de datos H2
spring.datasource.url=jdbc:h2:file:./data/facturedb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.profiles.active=activar-admin-local

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Correo
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.username=minipokersbdos@gmail.com
spring.mail.password=${MAIL_PASSWORD:}

# ==========================================
# JWT
# ==========================================
app.jwt.secret=${JWT_SECRET:BD9FxPke3VCs17ZB4obQvdYmW6ZQvk88rH51aBWU6AoUL2yTJgS4xQN65HPUuLzJpByz/HTCnQIUZr76tos1bQ==}
# Token de acceso: 15 minutos
app.jwt.access-expiration-ms=900000
# Token de renovación: 7 días
app.jwt.refresh-expiration-ms=604800000
# true solo cuando el sitio use HTTPS
app.jwt.cookie-secure=false

# ==========================================
# Swagger
# ==========================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method